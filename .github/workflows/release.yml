name: Build & Release Signed APK / AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.0.8). Leave blank to use tag or auto-detect version.'
        required: false
        default: ''
      is_draft:
        description: 'Create as Draft Release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release & Draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Android Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.keystore

      - name: Setup Google Services (Optional)
        if: env.GOOGLE_SERVICES_JSON != ''
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > androidApp/src/google-services.json

      - name: Build Signed APK & AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/androidApp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME=$(grep -m 1 'versionName =' androidApp/build.gradle.kts | cut -d '"' -f 2)
            TAG="v${VERSION_NAME:-0.0.8}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare & Name Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.get_tag.outputs.tag }}"
          # Find and copy APK
          APK_FILE=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "release-artifacts/Procrastaint-${TAG}.apk"
          fi
          # Find and copy AAB
          AAB_FILE=$(find androidApp/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release-artifacts/Procrastaint-${TAG}.aab"
          fi
          # Copy ProGuard mapping if present
          if [ -f androidApp/build/outputs/mapping/release/mapping.txt ]; then
            cp androidApp/build/outputs/mapping/release/mapping.txt "release-artifacts/mapping-${TAG}.txt"
          fi

      - name: Create Draft Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Release ${{ steps.get_tag.outputs.tag }}"
          draft: ${{ github.event_name == 'release' && github.event.release.draft || (github.event_name == 'workflow_dispatch' && github.event.inputs.is_draft == 'true') || true }}
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
